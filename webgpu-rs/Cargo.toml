# webgpu: A cube drawn by wgpu (WebGPU in Rust) on its own thread into a GpuImage (Windows).
# A complete project: copy this folder to start an app (see the README one folder up).

[package]
name = "webgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
elegance = { git = "https://github.com/EleganceUI/elegance-rs" }

# wgpu on Direct3D 12, and the Direct3D 12 calls that open the image's shared textures and fence
# (the windows version wgpu uses).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi"] }
