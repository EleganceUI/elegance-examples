# Every Rust example in one workspace (one target folder, one build of Elegance). Each <name>-rs
# folder is also a complete project on its own.

[workspace]
resolver = "2"
members = [
    "hello-rs",
    "counter-rs",
    "todos-rs",
    "components-rs",
    "effects-rs",
    "grids-rs",
    "icon-strip-rs",
    "popover-rs",
    "split-view-rs",
    "preview-rs",
    "wgpu-image-rs",
    "wgpu-direct-rs",
]

# Use the local build-script fix when running examples from this checkout.
# [patch."https://github.com/EleganceUI/elegance-rs"]
# elegance-sys = { path = "../elegance-rs/elegance-sys" }
