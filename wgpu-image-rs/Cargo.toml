# wgpu-image: A cube drawn by wgpu on its own thread, displayed through an Elegance VideoFeed.
# A complete project: copy this folder to start an app (see the README one folder up).

[package]
name = "wgpu-image"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
elegance = { git = "https://github.com/EleganceUI/elegance-rs" }
wgpu = "30"
pollster = "0.4"
